<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11111b" />
    <title>VN Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game" aria-label="Интерактивная сцена с Alice">
      <header class="game__title">VN Prototype <span class="phase-label">Interaction</span></header>

      <section class="scene scene--interaction" aria-label="Игровая сцена">
        <div class="character character--state-1" aria-label="Состояние Alice">
          <span>Character placeholder</span>
          <span class="character__state">State 1 — Distant</span>
        </div>
      </section>

      <section class="interactive-scene" hidden aria-label="Интерактивная сцена">
        <div class="interactive-placeholder">
          <span>Interactive scene</span>
          <strong class="rhythm-display">Rhythm 1 — Slow</strong>
          <small>Animation placeholder</small>
        </div>
        <div class="reaction-meter" role="progressbar" aria-label="Reaction" aria-valuemin="0" aria-valuemax="100">
          <div class="reaction-meter__header"><span>Reaction</span><strong class="reaction-value">0</strong></div>
          <div class="reaction-meter__track"><span class="reaction-meter__fill"></span></div>
        </div>
      </section>

      <section class="after-scene" hidden aria-label="Финальная сцена">
        <div class="after-placeholder"><span>After scene</span><strong>Placeholder</strong></div>
      </section>

      <section class="dialogue" aria-live="polite">
        <div class="dialogue__name">Alice</div>
        <p class="dialogue__text"></p>
        <p class="scene-hint">Выбери ответ или действие</p>
        <div class="answers" aria-label="Варианты ответа"></div>

        <div class="controls" hidden>
          <fieldset class="control-group rhythm-controls">
            <legend>Rhythm <strong class="rhythm-value">1 — Slow</strong></legend>
          </fieldset>
          <div class="interactive-actions">
            <button class="finish" type="button">Finish</button>
          </div>
        </div>

        <button class="restart" type="button" hidden>Restart</button>
      </section>

      <button class="debug-toggle" type="button" aria-expanded="false">DEBUG</button>
      <output class="debug-panel" hidden></output>
    </main>
    <script src="script.js"></script>
  </body>
</html>
