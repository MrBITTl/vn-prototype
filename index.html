<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11111b" />
    <title>VN Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game" aria-label="Сцена визуальной новеллы">
      <header class="game__title">VN Prototype</header>

      <section class="scene" aria-label="Игровая сцена">
        <div class="character" aria-label="Место для изображения персонажа">
          <span>Character</span>
          <span>Placeholder</span>
        </div>
      </section>

      <section class="dialogue" aria-live="polite">
        <div class="dialogue__name">Alice</div>
        <p class="dialogue__text">Привет. Я тебя раньше здесь не видела.</p>

        <div class="answers" aria-label="Варианты ответа">
          <button type="button" data-answer="Привет! Я здесь впервые.">
            Привет! Я здесь впервые.
          </button>
          <button type="button" data-answer="А ты всех здесь запоминаешь?">
            А ты всех здесь запоминаешь?
          </button>
          <button type="button" data-answer="Не твоё дело.">Не твоё дело.</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
